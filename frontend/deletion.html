<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data deletion status – Slap the Abuser</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#12221e;color:#f4efe4;font:16px/1.55 system-ui,sans-serif}
  main{max-width:520px;margin:0 auto;padding:32px 16px}
  a{color:#f2b134}
</style>
</head>
<body>
<main>
  <h1>Data deletion status</h1>
  <p id="msg" role="status">Checking…</p>
  <p><a href="privacy.html">Privacy &amp; data deletion</a> · <a href="index.html">Back to the game</a></p>
</main>
<script src="js/config.js"></script>
<script>
  // Meta sends users here with ?code=<confirmation_code> after a data-deletion request.
  (function () {
    var msg = document.getElementById('msg');
    var code = new URLSearchParams(location.search).get('code');
    if (!code) { msg.textContent = 'No confirmation code was provided.'; return; }
    fetch(window.PUNISHER_CONFIG.API_BASE_URL + '/auth/facebook/data-deletion/' + encodeURIComponent(code))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.success) { msg.textContent = 'This confirmation code was not found.'; return; }
        msg.textContent = j.data.status === 'completed'
          ? 'Your data was deleted. Confirmation code: ' + code
          : j.data.status === 'not_found'
            ? 'We found no data linked to this request, so there was nothing to delete. Confirmation code: ' + code
            : 'Your request is being processed. Confirmation code: ' + code;
      })
      .catch(function () { msg.textContent = 'The status service is unreachable right now. Please try again later.'; });
  })();
</script>
</body>
</html>
